# Supabase configuration for Kaalchakra
project_id = "kaalchakra"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173/**", "http://127.0.0.1:5174/**"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true

[functions.game-master]
verify_jwt = true
